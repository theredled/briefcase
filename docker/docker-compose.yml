#version: '3.8'
#-- foireux (???)
#name: briefcase

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8008:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../public:/var/www/briefcase/public
      #- uploads_data:/var/www/var/downloadable_files  # Uploads persistants
    depends_on:
      - php

  # MySQL - not needed as we're using Sqlite
  #mysql:
  #  ports:
  #    - "3308:3306"
  #  image: mysql:8.0
  #  volumes:
  #    - database_data:/var/lib/mysql  # BDD persistante
  #  environment:
  #    MYSQL_ROOT_PASSWORD: secret
  #    MYSQL_DATABASE: mydb
  #    MYSQL_USER: user
  #    MYSQL_PASSWORD: pass

  # PHP-FPM (ton app Symfony)
  php:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    volumes:
      - ../:/var/www/briefcase
      - vendor:/var/www/briefcase/vendor
      - var_data:/var/www/briefcase/var
      - public_var_data:/var/www/briefcase/public/dl
      - /var/www/briefcase/var/cache
      - /var/www/briefcase/var/log
    #environment:
      #DATABASE_URL: mysql://user:pass@mysql:3306/mydb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # -- says Claude --
      # Active Xdebug automatiquement
      XDEBUG_MODE: debug,develop
      # Indique à PHPStorm quel "Server" utiliser (optionnel si un seul)
      #PHP_IDE_CONFIG: "serverName=Docker2"

volumes:
  vendor:
    driver: local
  var_data:
    driver: local
  public_var_data:
    driver: local
